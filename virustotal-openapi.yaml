openapi: 3.0.0
info:
  title: VirusTotal API
  version: 3.0.0
servers:
  - url: https://www.virustotal.com/api/v3
paths:
  /ip_addresses/{ip}:
    get:
      summary: Get IP reputation
      parameters:
        - name: ip
          in: path
          required: true
          schema: {type: string}
  /urls/{url_id}:
    get:
      summary: Analyze URL
      parameters:
        - name: url_id
          in: path
          required: true
          schema: {type: string}
  /files/{hash}:
    get:
      summary: Check file hash
      parameters:
        - name: hash
          in: path
          required: true
          schema: {type: string}
securitySchemes:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: x-apikey
security:
  - ApiKeyAuth: []
